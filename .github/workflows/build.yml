name: Build Crypto APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libsqlite3-dev aidl zlib1g-dev python3-pip
          pip3 install --upgrade pip
          pip3 install buildozer cython==0.29.36

      - name: Build with Buildozer
        run: |
          echo "y" | buildozer -v android debug --allow-root

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Crypto-Signal-Bot-App
          path: bin/*.apk
